services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: away
      POSTGRES_USER: away
      POSTGRES_PASSWORD: away
    volumes:
      - away-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U away -d away"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  a-way-core:
    build: ./a-way-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/away
      SPRING_DATASOURCE_USERNAME: away
      SPRING_DATASOURCE_PASSWORD: away
      APP_CORS_ALLOWED_ORIGINS: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  a-way-web:
    build: ./a-way-web
    depends_on:
      - a-way-core
    ports:
      - "80:80"

volumes:
  away-pg:
