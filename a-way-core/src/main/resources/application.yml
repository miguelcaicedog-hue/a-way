server:
  port: 8080

spring:
  application:
    name: a-way-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/away}
    username: ${SPRING_DATASOURCE_USERNAME:away}
    password: ${SPRING_DATASOURCE_PASSWORD:away}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}
