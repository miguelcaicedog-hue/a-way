server:
  port: 8080
  tomcat:
    max-http-form-post-size: 4MB
    max-swallow-size: 4MB

spring:
  application:
    name: a-way-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/away}
    username: ${SPRING_DATASOURCE_USERNAME:away}
    password: ${SPRING_DATASOURCE_PASSWORD:away}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1:5173}
